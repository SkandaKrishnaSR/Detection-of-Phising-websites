<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Phishing Website Detection</h1>
    <form id="url-form">
        <input type="text" id="url-input" placeholder="Enter URL to check" required>
        <button type="submit">Check</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('url-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission

            const url = document.getElementById('url-input').value.trim(); // Get and trim the URL

            // Check if the URL input is empty
            if (!url) {
                document.getElementById('result').innerHTML = 'Please enter a valid URL.';
                return; // Stop further execution if URL is empty
            }

            // Send the POST request to the Flask server
            fetch('/check-phishing', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded', // Send data as URL-encoded
                },
                body: new URLSearchParams({ url: url }) // Send the URL as form data
            })
            .then(response => response.json()) // Parse the JSON response from Flask
            .then(data => {
                // Handle the response (display the result)
                document.getElementById('result').innerHTML = `Phishing: ${data.is_phishing ? 'Yes' : 'No'}`;
            })
            .catch(error => {
                // Handle any errors
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 'Error checking URL. Please try again later.';
            });
        });
    </script>

</body>
</html>
